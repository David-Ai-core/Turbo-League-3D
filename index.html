
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAZE OPS - FPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">
    <div id="hud">
      <div class="hud-box">
        <span>HEALTH</span>
        <strong id="health">100</strong>
      </div>
      <div class="hud-box">
        <span>LEVEL</span>
        <strong id="level">1 / 5</strong>
      </div>
      <div class="hud-box">
        <span>ENERGY CELLS</span>
        <strong id="ammo">35 / ∞</strong>
      </div>
    </div>

    <div id="message">FIND THE KEY TO UNLOCK THE EXIT</div>
    <div id="crosshair">+</div>

    <div id="controls">
      <div id="joystick">
        <div id="stick"></div>
      </div>

      <div id="lookArea"></div>

      <div id="actionButtons">
        <button id="fire">FIRE</button>
        <button id="reload">RELOAD</button>
        <button id="dash">DASH</button>
      </div>
    </div>

    <div id="startScreen" class="overlay">
      <h1>MAZE OPS</h1>
      <p>Explore the maze. Collect the key. Find the exit.</p>
      <p>Use your pulse blaster to deactivate the rogue drones.</p>
      <button id="startButton">START GAME</button>
    </div>

    <div id="endScreen" class="overlay hidden">
      <h1 id="endTitle">LEVEL COMPLETE</h1>
      <p id="endText">Well done!</p>
      <button id="nextButton">CONTINUE</button>
    </div>

    <div id="gameOver" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p>Your mission has ended.</p>
      <button id="restartButton">TRY AGAIN</button>
    </div>

    <div id="reloadText">RELOADING!</div>
    <div id="dashText">DASH READY</div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
